services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pulsepay-postgres
    environment:
      POSTGRES_USER: pulsepay
      POSTGRES_PASSWORD: pulsepay_secret
      POSTGRES_DB: pulsepay_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepay -d pulsepay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pulsepay-api:
    build: .
    container_name: pulsepay-api
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulsepay:pulsepay_secret@postgres-db:5432/pulsepay_db
    ports:
      - "8080:8000"

  localstack:
    image: motoserver/moto:5.0.21
    container_name: pulsepay-localstack
    environment:
      MOTO_PORT: "4566"
    ports:
      - "4566:4566"
